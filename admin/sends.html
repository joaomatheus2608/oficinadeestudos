        <div class="filter-group">

          <select id="filter-campaign"><option value="">Todas</option></select>
        </div>

          <label>Status</label>
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="pending">Pendente</option>
            <option value="processing">Processando</option>
            <option value="sent">Enviado</option>
            <option value="delivered">Entregue</option>
            <option value="failed">Falhou</option>
            <option value="rejected">Rejeitado</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Data inicial</label>
          <input type="date" id="filter-date-from" />
        </div>
        <div class="filter-group">
          <label>Data final</label>
          <input type="date" id="filter-date-to" />
        </div>
        <div class="filter-group" style="justify-content:flex-end;min-width:auto;">
          <button class="btn btn--ghost btn--sm" id="clear-filters" style="margin-top:1.4rem;">Limpar</button>
        </div>
      </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Destinatário</th>
                <th>E-mail</th>
                <th>Campanha</th>
                <th>Enviado em</th>
                <th>Status</th>
                <th>ID Resend</th>
                <th>Erro</th>
              </tr>
            </thead>
            <tbody id="sends-tbody">
              <tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--gray-text);">Carregando…</td></tr>
            </tbody>
          </table>

          <div class="pagination__info">

<script src="assets/js/admin-utils.js"></script>
<script>
(async function() {
  const session = await requireAuth();
  if (!session) return;

  document.getElementById('sidebar-user-email').textContent = session.user.email;
  document.getElementById('topbar-user-name').textContent   = session.user.email.split('@')[0];
  document.getElementById('user-avatar').textContent = session.user.email[0]?.toUpperCase();
  initSidebar();

  const sb = getSB();
  const PAGE_SIZE = 25;
  let allSends  = [];
  let filtered  = [];
  let currentPage = 1;

  // ---- Load campaigns for filter ----
  const { data: camps } = await sb.from('campaigns').select('id, name').order('name');
  (camps || []).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    document.getElementById('filter-campaign').appendChild(opt);
  });

  // ---- Load sends ----
  async function loadSends() {
    const { data, error } = await sb
      .from('email_sends')
      .select('id, status, resend_id, error_message, sent_at, created_at, campaign_id, lead_id, campaigns(name), leads(name, email)')
      .order('created_at', { ascending: false });

    if (error) { toast('Erro ao carregar envios: ' + error.message, 'error'); return; }
    allSends = data || [];
    applyFilters();
  }

  function applyFilters() {
    const search   = document.getElementById('filter-search').value.toLowerCase();
    const campaign = document.getElementById('filter-campaign').value;
    const status   = document.getElementById('filter-status').value;
    const dateFrom = document.getElementById('filter-date-from').value;
    const dateTo   = document.getElementById('filter-date-to').value;

    filtered = allSends.filter(s => {
      const name  = s.leads?.name?.toLowerCase() || '';
      const email = s.leads?.email?.toLowerCase() || '';
      const matchSearch   = !search || name.includes(search) || email.includes(search);
      const matchCampaign = !campaign || s.campaign_id === campaign;
      const matchStatus   = !status || s.status === status;
      const created       = new Date(s.created_at);
      const matchFrom     = !dateFrom || created >= new Date(dateFrom);
      const matchTo       = !dateTo   || created <= new Date(dateTo + 'T23:59:59');
      return matchSearch && matchCampaign && matchStatus && matchFrom && matchTo;
    });

    document.getElementById('sends-count-desc').textContent = `${filtered.length} registro${filtered.length !== 1 ? 's' : ''}`;
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = Math.min(start + PAGE_SIZE, filtered.length);
    const page  = filtered.slice(start, end);
    const total = filtered.length;

    document.getElementById('page-info-from').textContent  = total ? start + 1 : 0;
    document.getElementById('page-info-to').textContent    = end;
    document.getElementById('page-info-total').textContent = total;

    const tbody = document.getElementById('sends-tbody');
    if (!page.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--gray-text);">Nenhum envio encontrado.</td></tr>';
    } else {
      tbody.innerHTML = page.map(s => `<tr>
        <td><strong style="font-size:.9rem;">${s.leads?.name || '—'}</strong></td>
        <td style="font-size:.85rem;">${s.leads?.email || '—'}</td>
        <td style="font-size:.82rem;">${s.campaigns?.name || '—'}</td>
        <td style="font-size:.82rem;white-space:nowrap;">${fmtDate(s.sent_at || s.created_at)}</td>
        <td>${statusBadge(s.status)}</td>
        <td style="font-size:.78rem;color:var(--gray-text);max-width:120px;overflow:hidden;text-overflow:ellipsis;" title="${s.resend_id || ''}">${s.resend_id ? s.resend_id.slice(0,16)+'…' : '—'}</td>
        <td style="font-size:.78rem;color:var(--danger);max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${s.error_message || ''}">${s.error_message ? s.error_message.slice(0,40)+(s.error_message.length>40?'…':'') : '—'}</td>
      </tr>`).join('');
    }

    buildPagination('pagination-controls', currentPage, Math.ceil(total / PAGE_SIZE) || 1, (p) => { currentPage = p; renderPage(); });
  }

  document.getElementById('export-sends-btn').addEventListener('click', () => {
    exportCSV(filtered.map(s => ({
      Destinatário: s.leads?.name || '',
      Email: s.leads?.email || '',
      Campanha: s.campaigns?.name || '',
      Enviado: fmtDate(s.sent_at || s.created_at),
      Status: s.status,
      ResendID: s.resend_id || '',
      Erro: s.error_message || '',
    })), `envios_${new Date().toISOString().slice(0,10)}.csv`);
  });

  const dSearch = debounce(applyFilters, 300);
  document.getElementById('filter-search').addEventListener('input', dSearch);
  document.getElementById('filter-campaign').addEventListener('change', applyFilters);
  document.getElementById('filter-status').addEventListener('change', applyFilters);
  document.getElementById('filter-date-from').addEventListener('change', applyFilters);
  document.getElementById('filter-date-to').addEventListener('change', applyFilters);
  document.getElementById('clear-filters').addEventListener('click', () => {
    ['filter-search','filter-campaign','filter-status','filter-date-from','filter-date-to'].forEach(id => {
      document.getElementById(id).value = '';
    });
    applyFilters();
  });

  await loadSends();
})();
</script>
