<div class="admin-layout">

      <button class="nav-link active" onclick="location.href='leads.html'"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Leads</button>
      <button class="nav-link" onclick="location.href='sends.html'"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Histórico de Envios</button>

      <button class="nav-link" id="signout-btn"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sair</button>
    </nav>
    <div class="sidebar__footer"><strong id="sidebar-user-email">—</strong>Painel Administrativo</div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar__left">
        <button class="topbar-menu-btn" id="topbar-menu-btn"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div><div class="admin-topbar__title">Leads</div><div class="admin-topbar__subtitle">Contatos capturados pelas campanhas</div></div>
      </div>
      <div class="admin-topbar__right">
        <div class="topbar-user"><div class="topbar-user__avatar" id="user-avatar">?</div><span id="topbar-user-name">—</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div class="page-header">
        <div>
          <h1 class="page-header__title">Leads</h1>
          <p class="page-header__desc" id="leads-count-desc">Carregando…</p>
        </div>
        <div class="page-header__actions">
          <button class="btn btn--outline" id="export-btn">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Exportar CSV
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <div class="filter-group" style="flex:2;min-width:220px;">
          <label>Buscar por nome ou e-mail</label>
          <input type="search" id="filter-search" placeholder="Digite para filtrar…" />
        </div>
        <div class="filter-group">
          <label>Campanha</label>
          <select id="filter-campaign"><option value="">Todas</option></select>
        </div>
        <div class="filter-group">
          <label>Status do envio</label>
          <select id="filter-status">
            <option value="">Todos</option>
            <option value="pending">Pendente</option>
            <option value="sent">Enviado</option>
            <option value="delivered">Entregue</option>
            <option value="failed">Falhou</option>
            <option value="rejected">Rejeitado</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Data inicial</label>
          <input type="date" id="filter-date-from" />
        </div>
        <div class="filter-group">
          <label>Data final</label>
          <input type="date" id="filter-date-to" />
        </div>
        <div class="filter-group" style="justify-content:flex-end;min-width:auto;">
          <button class="btn btn--ghost btn--sm" id="clear-filters" style="margin-top:1.4rem;">Limpar</button>
        </div>
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Campanha</th>
                <th>Cadastrado em</th>
                <th>Status envio</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="leads-tbody">
              <tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--gray-text);">Carregando leads…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination__info">
            Exibindo <span id="page-info-from">—</span>–<span id="page-info-to">—</span>
            de <span id="page-info-total">—</span> leads
          </div>
          <div class="pagination__controls" id="pagination-controls"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Lead detail modal -->
<div class="modal-overlay" id="lead-modal" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title">
  <div class="modal">
    <div class="modal__header">
      <h2 class="modal__title" id="lead-modal-title">Detalhes do Lead</h2>
      <button class="modal__close" id="lead-modal-close">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <div class="lead-info-grid" id="lead-detail-grid"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--danger btn--sm" id="lead-delete-btn" style="margin-right:auto;">Excluir Lead (LGPD)</button>
      <button class="btn btn--ghost" id="lead-modal-close2">Fechar</button>
      <a id="lead-wa-btn" href="#" target="_blank" rel="noopener" class="btn btn--blue" style="background:#25d366;border-color:#25d366;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Chamar no WhatsApp
      </a>
    </div>
  </div>
</div>

<script src="assets/js/admin-utils.js"></script>
<script>
(async function() {
  const session = await requireAuth();
  if (!session) return;

  document.getElementById('sidebar-user-email').textContent = session.user.email;
  document.getElementById('topbar-user-name').textContent   = session.user.email.split('@')[0];
  document.getElementById('user-avatar').textContent = session.user.email[0]?.toUpperCase();
  initSidebar();

  const sb = getSB();
  const PAGE_SIZE = 20;
  let allLeads    = [];
  let filtered    = [];
  let currentPage = 1;
  let campaigns   = [];

  // ---- Load campaigns for filter ----
  async function loadCampaigns() {
    const { data } = await sb.from('campaigns').select('id, name').order('name');
    campaigns = data || [];
    const sel = document.getElementById('filter-campaign');
    campaigns.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });

    const urlCampId = new URLSearchParams(window.location.search).get('campaign');
    if (urlCampId) {
      sel.value = urlCampId;
    }
  }

  // ---- Load leads ----
  async function loadLeads() {
    const { data, error } = await sb
      .from('leads')
      .select('id, name, email, phone, created_at, campaign_id, privacy_consent, campaigns(name), email_sends(id, status, sent_at, created_at)')
      .order('created_at', { ascending: false });

    if (error) { toast('Erro ao carregar leads: ' + error.message, 'error'); return; }
    allLeads = data || [];
    applyFilters();
  }

  // ---- Filters ----
  function applyFilters() {
    const search   = document.getElementById('filter-search').value.toLowerCase();
    const campaign = document.getElementById('filter-campaign').value;
    const status   = document.getElementById('filter-status').value;
    const dateFrom = document.getElementById('filter-date-from').value;
    const dateTo   = document.getElementById('filter-date-to').value;

    filtered = allLeads.filter(l => {
      const matchSearch   = !search || l.name.toLowerCase().includes(search) || l.email.toLowerCase().includes(search);
      const matchCampaign = !campaign || l.campaign_id === campaign;
      const latestSend    = l.email_sends?.[l.email_sends.length - 1];
      const matchStatus   = !status || latestSend?.status === status || (!latestSend && status === 'pending');
      const created       = new Date(l.created_at);
      const matchFrom     = !dateFrom || created >= new Date(dateFrom);
      const matchTo       = !dateTo   || created <= new Date(dateTo + 'T23:59:59');
      return matchSearch && matchCampaign && matchStatus && matchFrom && matchTo;
    });

    const selectedCamp = campaigns.find(c => c.id === campaign);
    const campSuffix = selectedCamp ? ` na campanha "${selectedCamp.name}"` : '';
    document.getElementById('leads-count-desc').textContent = `${filtered.length} lead${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}${campSuffix}`;
    currentPage = 1;
    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const end   = Math.min(start + PAGE_SIZE, filtered.length);
    const page  = filtered.slice(start, end);
    const total = filtered.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;

    document.getElementById('page-info-from').textContent  = total ? start + 1 : 0;
    document.getElementById('page-info-to').textContent    = end;
    document.getElementById('page-info-total').textContent = total;

    const tbody = document.getElementById('leads-tbody');
    if (!page.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:3rem;color:var(--gray-text);">Nenhum lead encontrado.</td></tr>';
    } else {
      tbody.innerHTML = page.map(lead => {
        const latestSend = lead.email_sends?.[lead.email_sends.length - 1];
        const statusVal  = latestSend?.status || 'pending';
        const wa = lead.phone ? `<a href="${whatsAppLink(lead.phone)}" target="_blank" rel="noopener" class="btn btn--sm" style="background:#25d366;border-color:#25d366;color:#fff;padding:.35rem .75rem;font-size:.78rem;" title="Chamar no WhatsApp">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </a>` : '<span style="color:var(--gray-text);font-size:.82rem;">—</span>';

        return `<tr>
          <td><strong style="font-size:.9rem;">${lead.name}</strong></td>
          <td style="font-size:.85rem;">${lead.email}</td>
          <td style="font-size:.85rem;white-space:nowrap;">${lead.phone || '—'}</td>
          <td style="font-size:.82rem;">${lead.campaigns?.name || '—'}</td>
          <td style="font-size:.82rem;white-space:nowrap;">${fmtDate(lead.created_at)}</td>
          <td>${statusBadge(statusVal)}</td>
          <td style="white-space:nowrap;display:flex;gap:.4rem;align-items:center;">
            <button class="btn btn--sm btn--ghost" onclick="showLeadDetail('${lead.id}')">Ver</button>
            ${wa}
          </td>
        </tr>`;
      }).join('');
    }

    buildPagination('pagination-controls', currentPage, totalPages, (p) => {
      currentPage = p; renderPage();
    });
  }

  // ---- Lead detail modal ----
  let currentDetailLeadId = null;

  window.showLeadDetail = function(id) {
    const lead = allLeads.find(l => l.id === id);
    if (!lead) return;
    currentDetailLeadId = id;
    const latestSend = lead.email_sends?.[lead.email_sends.length - 1];
    document.getElementById('lead-detail-grid').innerHTML = `
      <div class="lead-info-item"><div class="lead-info-item__label">Nome</div><div class="lead-info-item__value">${lead.name}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">E-mail</div><div class="lead-info-item__value">${lead.email}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Telefone/WhatsApp</div><div class="lead-info-item__value">${lead.phone || '—'}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Campanha</div><div class="lead-info-item__value">${lead.campaigns?.name || '—'}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Cadastrado em</div><div class="lead-info-item__value">${fmtDate(lead.created_at)}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Consentimento LGPD</div><div class="lead-info-item__value">${lead.privacy_consent ? '✅ Sim' : '❌ Não'}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Status do envio</div><div class="lead-info-item__value">${statusBadge(latestSend?.status || 'pending')}</div></div>
      <div class="lead-info-item"><div class="lead-info-item__label">Data do envio</div><div class="lead-info-item__value">${fmtDate(latestSend?.sent_at)}</div></div>
    `;
    const waBtn = document.getElementById('lead-wa-btn');
    if (lead.phone) {
      waBtn.href = whatsAppLink(lead.phone);
      waBtn.style.display = '';
    } else {
      waBtn.style.display = 'none';
    }
    document.getElementById('lead-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  ['lead-modal-close', 'lead-modal-close2'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      document.getElementById('lead-modal').classList.remove('open');
      document.body.style.overflow = '';
    });
  });

  document.getElementById('lead-delete-btn').addEventListener('click', async () => {
    if (!currentDetailLeadId) return;
    if (!confirm('Tem certeza que deseja excluir este lead permanentemente? (Conformidade LGPD)')) return;
    const { error } = await sb.from('leads').delete().eq('id', currentDetailLeadId);
    if (error) { toast('Erro ao excluir lead: ' + error.message, 'error'); return; }
    toast('Lead excluído com sucesso.', 'success');
    document.getElementById('lead-modal').classList.remove('open');
    document.body.style.overflow = '';
    await loadLeads();
  });

  // ---- Export ----
  document.getElementById('export-btn').addEventListener('click', () => {
    const rows = filtered.map(l => ({
      Nome: l.name,
      Email: l.email,
      Telefone: l.phone || '',
      Campanha: l.campaigns?.name || '',
      Cadastrado: fmtDate(l.created_at),
      Status: l.email_sends?.[l.email_sends.length - 1]?.status || 'pending',
    }));
    exportCSV(rows, `leads_${new Date().toISOString().slice(0,10)}.csv`);
  });

  // ---- Filter events ----
  const dSearch = debounce(applyFilters, 300);
  document.getElementById('filter-search').addEventListener('input', dSearch);
  document.getElementById('filter-campaign').addEventListener('change', applyFilters);
  document.getElementById('filter-status').addEventListener('change', applyFilters);
  document.getElementById('filter-date-from').addEventListener('change', applyFilters);
  document.getElementById('filter-date-to').addEventListener('change', applyFilters);
  document.getElementById('clear-filters').addEventListener('click', () => {
    document.getElementById('filter-search').value = '';
    document.getElementById('filter-campaign').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-date-from').value = '';
    document.getElementById('filter-date-to').value = '';
    applyFilters();
  });

  await Promise.all([loadCampaigns(), loadLeads()]);
})();
</script>
</body>
</html>
